<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Bancos — POS</title>
<link rel="stylesheet" href="/static/app.css">
<style>
  :root { --primary:#1a56db; --success:#16a34a; --danger:#dc2626; --warning:#d97706; }
  body { font-family:'Outfit',sans-serif; background:#f3f4f6; margin:0; }
  .topbar { background:var(--primary); color:#fff; padding:14px 24px; display:flex; align-items:center; gap:16px; }
  .topbar a { color:#fff; text-decoration:none; opacity:.8; }
  .container { max-width:1100px; margin:24px auto; padding:0 16px; }
  .tab-bar { display:flex; gap:4px; flex-wrap:wrap; margin-bottom:0; }
  .tab-btn { padding:8px 16px; border:none; background:#e5e7eb; border-radius:8px 8px 0 0; cursor:pointer; font-weight:600; font-size:.85rem; }
  .tab-btn.active { background:var(--primary); color:#fff; }
  .tab-panel { display:none; }
  .tab-panel.active { display:block; }
  .card { background:#fff; border-radius:0 12px 12px 12px; padding:20px; box-shadow:0 1px 4px rgba(0,0,0,.08); margin-bottom:20px; }
  .card h3 { margin:0 0 16px; font-size:1rem; color:#374151; border-bottom:1px solid #e5e7eb; padding-bottom:10px; }
  .grid2 { display:grid; grid-template-columns:1fr 1fr; gap:20px; }
  .grid3 { display:grid; grid-template-columns:repeat(3,1fr); gap:16px; }
  .bank-card { background:#fff; border:1.5px solid #e5e7eb; border-radius:12px; padding:18px; cursor:pointer; transition:.15s; }
  .bank-card:hover { border-color:var(--primary); box-shadow:0 2px 8px rgba(26,86,219,.12); }
  .bank-card.selected { border-color:var(--primary); background:#eff6ff; }
  .bank-name { font-weight:700; font-size:.95rem; color:#111; }
  .bank-num  { font-size:.8rem; color:#6b7280; font-family:monospace; margin:4px 0; }
  .bank-balance { font-size:1.2rem; font-weight:700; color:var(--primary); margin-top:8px; }
  .bank-type { display:inline-block; padding:2px 10px; border-radius:12px; font-size:.72rem; font-weight:600; background:#dbeafe; color:#1d4ed8; }
  .btn { padding:9px 18px; border:none; border-radius:8px; cursor:pointer; font-size:.88rem; font-weight:600; }
  .btn-primary { background:var(--primary); color:#fff; }
  .btn-success { background:var(--success); color:#fff; }
  .btn-danger  { background:var(--danger);  color:#fff; }
  .btn-outline { background:#fff; color:var(--primary); border:1.5px solid var(--primary); }
  .btn-sm { padding:5px 12px; font-size:.8rem; }
  .btn:hover { opacity:.88; }
  .filter-bar { display:flex; gap:12px; align-items:flex-end; flex-wrap:wrap; margin-bottom:16px; }
  .filter-bar label { font-size:.8rem; font-weight:600; color:#374151; display:block; margin-bottom:4px; }
  .filter-bar input, .filter-bar select { padding:8px 10px; border:1.5px solid #d1d5db; border-radius:8px; font-size:.85rem; }
  .input-row { display:flex; flex-direction:column; gap:5px; margin-bottom:12px; }
  .input-row label { font-size:.85rem; font-weight:600; color:#374151; }
  .input-row input, .input-row select { padding:9px 12px; border:1.5px solid #d1d5db; border-radius:8px; font-size:.9rem; }
  .input-row input:focus { border-color:var(--primary); outline:none; }
  table { width:100%; border-collapse:collapse; font-size:.85rem; }
  th { background:#f9fafb; padding:9px 10px; text-align:left; font-weight:600; color:#374151; border-bottom:2px solid #e5e7eb; }
  td { padding:9px 10px; border-bottom:1px solid #f3f4f6; }
  tr:hover td { background:#f9fafb; }
  .amount-pos { color:var(--success); font-weight:600; text-align:right; }
  .amount-neg { color:var(--danger); font-weight:600; text-align:right; }
  .amount-neu { font-weight:600; text-align:right; }
  .badge { display:inline-block; padding:2px 8px; border-radius:12px; font-size:.72rem; font-weight:600; }
  .badge-reconciled   { background:#dcfce7; color:#16a34a; }
  .badge-unreconciled { background:#fef3c7; color:#b45309; }
  .badge-ok     { background:#dcfce7; color:#16a34a; }
  .badge-draft  { background:#f3f4f6; color:#6b7280; }
  .badge-final  { background:#dbeafe; color:#1d4ed8; }
  .rec-formula  { background:#f9fafb; border-radius:10px; padding:16px; font-size:.88rem; margin-bottom:16px; }
  .rec-row { display:flex; justify-content:space-between; padding:5px 0; }
  .rec-row.total { font-weight:700; border-top:1.5px solid #e5e7eb; margin-top:6px; padding-top:10px; }
  .rec-balanced { color:var(--success); font-weight:700; text-align:center; margin-top:10px; }
  .rec-unbalanced { color:var(--danger); font-weight:700; text-align:center; margin-top:10px; }
  #alert { display:none; padding:10px 16px; border-radius:8px; margin-bottom:12px; font-weight:600; }
  .alert-ok  { background:#dcfce7; color:#16a34a; }
  .alert-err { background:#fee2e2; color:#dc2626; }
</style>
</head>
<body>

<div class="topbar">
  <a href="/">← Dashboard</a>
  <span style="font-size:1.1rem;font-weight:700;">🏦 Gestión de Bancos</span>
</div>

<div class="container">
  <div id="alert"></div>

  <div class="tab-bar">
    <button type="button" class="tab-btn active" onclick="showTab('tab-accounts')">Cuentas Bancarias</button>
    <button type="button" class="tab-btn" onclick="showTab('tab-transactions')">Movimientos</button>
    <button type="button" class="tab-btn" onclick="showTab('tab-reconciliation')">Conciliación Bancaria</button>
  </div>

  <!-- CUENTAS BANCARIAS -->
  <div id="tab-accounts" class="tab-panel active">
    <div class="grid2">
      <div>
        <div class="card">
          <h3>Cuentas Registradas</h3>
          <div id="bank-cards-list" class="grid3" style="min-height:80px;"></div>
        </div>
      </div>
      <div>
        <div class="card">
          <h3>Nueva Cuenta Bancaria</h3>
          <div class="input-row">
            <label for="new-bank-name">Banco</label>
            <input type="text" id="new-bank-name" placeholder="Ej: Banco Pichincha">
          </div>
          <div class="input-row">
            <label for="new-acc-num">Número de Cuenta</label>
            <input type="text" id="new-acc-num" placeholder="XXXX XXXX XXXX">
          </div>
          <div class="input-row">
            <label for="new-acc-type">Tipo de Cuenta</label>
            <select id="new-acc-type">
              <option value="CORRIENTE">Cuenta Corriente</option>
              <option value="AHORROS">Cuenta de Ahorros</option>
              <option value="VIRTUAL">Billetera Virtual</option>
            </select>
          </div>
          <div class="input-row">
            <label for="new-balance">Saldo Inicial (USD)</label>
            <input type="number" id="new-balance" value="0.00" step="0.01" min="0">
          </div>
          <button type="button" class="btn btn-success" onclick="createBankAccount()">Agregar Cuenta</button>
        </div>
      </div>
    </div>
  </div>

  <!-- MOVIMIENTOS -->
  <div id="tab-transactions" class="tab-panel">
    <div class="card">
      <h3>Movimientos Bancarios</h3>
      <div class="filter-bar">
        <div>
          <label for="txn-account">Cuenta</label>
          <select id="txn-account" onchange="loadTransactions()"></select>
        </div>
        <div>
          <label for="txn-start">Desde</label>
          <input type="date" id="txn-start">
        </div>
        <div>
          <label for="txn-end">Hasta</label>
          <input type="date" id="txn-end">
        </div>
        <button type="button" class="btn btn-primary" onclick="loadTransactions()">Filtrar</button>
        <button type="button" class="btn btn-outline" onclick="showNewTxnForm()">+ Nuevo Movimiento</button>
      </div>

      <!-- Formulario nuevo movimiento (oculto por defecto) -->
      <div id="new-txn-form" style="display:none;background:#f9fafb;border-radius:10px;padding:16px;margin-bottom:16px;">
        <div class="grid2">
          <div>
            <div class="input-row">
              <label for="ntxn-type">Tipo de Movimiento</label>
              <select id="ntxn-type">
                <option value="DEPOSITO">Depósito</option>
                <option value="RETIRO">Retiro</option>
                <option value="TRANSFERENCIA_IN">Transferencia Entrada</option>
                <option value="TRANSFERENCIA_OUT">Transferencia Salida</option>
                <option value="COMISION">Comisión Bancaria</option>
                <option value="INTERES">Interés Ganado</option>
                <option value="NOTA_CREDITO">Nota de Crédito Bancaria</option>
                <option value="NOTA_DEBITO">Nota de Débito Bancaria</option>
              </select>
            </div>
            <div class="input-row">
              <label for="ntxn-amount">Monto (+ ingreso / – egreso)</label>
              <input type="number" id="ntxn-amount" step="0.01" placeholder="Ej: 500.00 o -25.50">
            </div>
          </div>
          <div>
            <div class="input-row">
              <label for="ntxn-date">Fecha</label>
              <input type="date" id="ntxn-date">
            </div>
            <div class="input-row">
              <label for="ntxn-desc">Descripción</label>
              <input type="text" id="ntxn-desc" placeholder="Descripción del movimiento">
            </div>
            <div class="input-row">
              <label for="ntxn-ref">Referencia (opcional)</label>
              <input type="text" id="ntxn-ref" placeholder="N° comprobante, transferencia...">
            </div>
          </div>
        </div>
        <div style="display:flex;gap:10px;">
          <button type="button" class="btn btn-success" onclick="createTransaction()">Guardar</button>
          <button type="button" class="btn btn-outline" onclick="document.getElementById('new-txn-form').style.display='none'">Cancelar</button>
        </div>
      </div>

      <div id="txn-account-info" style="font-size:.9rem;color:#374151;margin-bottom:12px;"></div>
      <div style="overflow-x:auto;">
        <table>
          <thead>
            <tr>
              <th>Fecha</th><th>Descripción</th><th>Tipo</th><th>Referencia</th>
              <th title="Monto">Monto $</th><th title="Saldo">Saldo $</th>
              <th>Conciliado</th>
            </tr>
          </thead>
          <tbody id="txn-body"></tbody>
        </table>
      </div>
    </div>
  </div>

  <!-- CONCILIACIÓN -->
  <div id="tab-reconciliation" class="tab-panel">
    <div class="grid2">
      <!-- Lista de conciliaciones -->
      <div>
        <div class="card">
          <h3>Conciliaciones Bancarias</h3>
          <div class="filter-bar">
            <div>
              <label for="rec-account">Cuenta</label>
              <select id="rec-account" onchange="loadReconciliations()"></select>
            </div>
          </div>
          <div id="rec-list"></div>
        </div>
      </div>

      <!-- Nueva conciliación / detalle -->
      <div>
        <div class="card" id="rec-form-card">
          <h3>Nueva Conciliación</h3>
          <div class="input-row">
            <label for="rec-period">Período</label>
            <input type="text" id="rec-period" placeholder="Enero 2025">
          </div>
          <div class="grid2">
            <div class="input-row">
              <label for="rec-pstart">Desde</label>
              <input type="date" id="rec-pstart">
            </div>
            <div class="input-row">
              <label for="rec-pend">Hasta</label>
              <input type="date" id="rec-pend">
            </div>
          </div>
          <div class="grid2">
            <div class="input-row">
              <label for="rec-bank-end">Saldo Final Banco (extracto)</label>
              <input type="number" id="rec-bank-end" step="0.01" placeholder="0.00">
            </div>
            <div class="input-row">
              <label for="rec-book-end">Saldo Final Libros (contabilidad)</label>
              <input type="number" id="rec-book-end" step="0.01" placeholder="0.00">
            </div>
          </div>
          <button type="button" class="btn btn-success" onclick="createReconciliation()">Iniciar Conciliación</button>
        </div>

        <div class="card" id="rec-detail-card" style="display:none;">
          <h3 id="rec-detail-title">Conciliación</h3>
          <div class="rec-formula" id="rec-formula"></div>

          <h4 style="font-size:.88rem;margin:12px 0 8px;">Agregar Partida de Conciliación</h4>
          <div class="grid2">
            <div class="input-row">
              <label for="item-type">Tipo</label>
              <select id="item-type">
                <option value="DEPOSITO_TRANSITO">Depósito en Tránsito (+banco)</option>
                <option value="CHEQUE_PENDIENTE">Cheque Pendiente (–banco)</option>
                <option value="CREDITO_BANCARIO">Crédito Banco no registrado (+libros)</option>
                <option value="CARGO_BANCARIO">Cargo Banco no registrado (–libros)</option>
                <option value="ERROR_LIBROS">Error en Libros</option>
                <option value="ERROR_BANCO">Error del Banco</option>
              </select>
            </div>
            <div class="input-row">
              <label for="item-amount">Monto $</label>
              <input type="number" id="item-amount" step="0.01" placeholder="0.00">
            </div>
          </div>
          <div class="input-row">
            <label for="item-desc">Descripción</label>
            <input type="text" id="item-desc" placeholder="Detalle de la partida">
          </div>
          <div style="display:flex;gap:10px;margin-bottom:16px;">
            <button type="button" class="btn btn-primary btn-sm" onclick="addRecItem()">Agregar Partida</button>
          </div>

          <div id="rec-items-list"></div>

          <button type="button" class="btn btn-success" id="btn-finalize" onclick="finalizeReconciliation()" style="margin-top:12px;">
            ✅ Aprobar Conciliación
          </button>
        </div>
      </div>
    </div>
  </div>
</div>

<script>
const COMPANY_ID = 1;
const fmt = n => '$' + parseFloat(n||0).toFixed(2);
let bankAccounts = [];
let currentRecId = null;

function showAlert(msg, ok=true) {
  const el = document.getElementById('alert');
  el.className = ok ? 'alert-ok' : 'alert-err';
  el.textContent = msg; el.style.display='block';
  setTimeout(() => el.style.display='none', 5000);
}

function showTab(id) {
  document.querySelectorAll('.tab-panel').forEach(p => p.classList.remove('active'));
  document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
  document.getElementById(id).classList.add('active');
  event.target.classList.add('active');
}

// ── Cuentas Bancarias ──────────────────────────────────────────────────────────
async function loadBankAccounts() {
  const r = await fetch(`/api/bancos/accounts?company_id=${COMPANY_ID}`);
  bankAccounts = await r.json();

  const container = document.getElementById('bank-cards-list');
  container.innerHTML = bankAccounts.map(a => `
    <div class="bank-card" onclick="selectAccount(${a.id})">
      <div class="bank-name">${a.bank_name}</div>
      <div class="bank-num">${a.account_number}</div>
      <span class="bank-type">${a.account_type}</span>
      <div class="bank-balance">${fmt(a.current_balance)}</div>
    </div>`).join('') || '<p style="color:#9ca3af;font-size:.9rem;">Sin cuentas registradas</p>';

  // Poblar selects de otras pestañas
  ['txn-account','rec-account'].forEach(selId => {
    const sel = document.getElementById(selId);
    sel.innerHTML = bankAccounts.map(a =>
      `<option value="${a.id}">${a.bank_name} — ${a.account_number}</option>`
    ).join('');
  });
}

function selectAccount(id) {
  document.querySelectorAll('.bank-card').forEach(c => c.classList.remove('selected'));
  event.currentTarget.classList.add('selected');
  document.getElementById('txn-account').value = id;
  loadTransactions();
  showTab('tab-transactions');
  document.querySelectorAll('.tab-btn')[1].classList.add('active');
  document.querySelectorAll('.tab-btn')[0].classList.remove('active');
}

async function createBankAccount() {
  const name    = document.getElementById('new-bank-name').value.trim();
  const num     = document.getElementById('new-acc-num').value.trim();
  const type    = document.getElementById('new-acc-type').value;
  const balance = parseFloat(document.getElementById('new-balance').value) || 0;
  if (!name || !num) return showAlert('Complete banco y número de cuenta', false);

  const r = await fetch('/api/bancos/accounts', {
    method:'POST', headers:{'Content-Type':'application/json'},
    body: JSON.stringify({company_id: COMPANY_ID, bank_name:name, account_number:num, account_type:type, initial_balance:balance})
  });
  if (r.ok) {
    showAlert('Cuenta bancaria creada');
    document.getElementById('new-bank-name').value = '';
    document.getElementById('new-acc-num').value = '';
    document.getElementById('new-balance').value = '0.00';
    loadBankAccounts();
  } else {
    const d = await r.json();
    showAlert(d.detail || 'Error', false);
  }
}

// ── Movimientos ────────────────────────────────────────────────────────────────
async function loadTransactions() {
  const accId = document.getElementById('txn-account').value;
  if (!accId) return;
  const start = document.getElementById('txn-start').value;
  const end   = document.getElementById('txn-end').value;
  let url = `/api/bancos/accounts/${accId}/transactions`;
  const params = [];
  if (start) params.push(`start=${start}`);
  if (end)   params.push(`end=${end}`);
  if (params.length) url += '?' + params.join('&');

  const r = await fetch(url);
  const txns = await r.json();

  const acc = bankAccounts.find(a => a.id == accId);
  if (acc) {
    document.getElementById('txn-account-info').innerHTML =
      `<b>${acc.bank_name}</b> — ${acc.account_number} | Saldo actual: <b style="color:var(--primary)">${fmt(acc.current_balance)}</b>`;
  }

  const tbody = document.getElementById('txn-body');
  tbody.innerHTML = txns.map(t => {
    const pos = t.amount >= 0;
    const cls = pos ? 'amount-pos' : 'amount-neg';
    const reconciled = t.is_reconciled
      ? '<span class="badge badge-reconciled">Conciliado</span>'
      : '<span class="badge badge-unreconciled">Pendiente</span>';
    return `<tr>
      <td>${t.date}</td>
      <td>${t.description}</td>
      <td style="font-size:.8rem;color:#6b7280;">${t.type}</td>
      <td style="font-size:.8rem;">${t.reference||'—'}</td>
      <td class="${cls}">${pos?'+':''}${fmt(t.amount)}</td>
      <td class="amount-neu">${fmt(t.balance_after)}</td>
      <td>${reconciled}</td>
    </tr>`;
  }).join('') || '<tr><td colspan="7" style="text-align:center;color:#9ca3af;">Sin movimientos en el período</td></tr>';
}

function showNewTxnForm() {
  document.getElementById('new-txn-form').style.display = 'block';
}

async function createTransaction() {
  const accId  = document.getElementById('txn-account').value;
  const type   = document.getElementById('ntxn-type').value;
  const amount = parseFloat(document.getElementById('ntxn-amount').value);
  const date   = document.getElementById('ntxn-date').value;
  const desc   = document.getElementById('ntxn-desc').value.trim();
  const ref    = document.getElementById('ntxn-ref').value.trim();

  if (!accId || isNaN(amount) || !date || !desc) return showAlert('Complete todos los campos requeridos', false);

  const r = await fetch('/api/bancos/transactions', {
    method:'POST', headers:{'Content-Type':'application/json'},
    body: JSON.stringify({bank_account_id: parseInt(accId), transaction_date:date, description:desc, reference:ref||null, transaction_type:type, amount, source:'MANUAL'})
  });
  if (r.ok) {
    showAlert('Movimiento registrado');
    document.getElementById('new-txn-form').style.display = 'none';
    document.getElementById('ntxn-amount').value='';
    document.getElementById('ntxn-desc').value='';
    await loadBankAccounts();
    loadTransactions();
  } else {
    const d = await r.json();
    showAlert(d.detail || 'Error', false);
  }
}

// ── Conciliación Bancaria ──────────────────────────────────────────────────────
async function loadReconciliations() {
  const accId = document.getElementById('rec-account').value;
  if (!accId) return;
  const r = await fetch(`/api/bancos/reconciliations?bank_account_id=${accId}`);
  const recs = await r.json();
  const list = document.getElementById('rec-list');
  list.innerHTML = recs.map(r => {
    const badgeCls = r.status==='APROBADA' ? 'badge-ok' : r.status==='FINALIZADA' ? 'badge-final' : 'badge-draft';
    const balanced = r.is_balanced;
    return `<div style="border:1.5px solid ${balanced?'#d1fae5':'#fee2e2'};border-radius:8px;padding:12px;margin-bottom:8px;cursor:pointer;"
              onclick="viewReconciliation(${r.id})">
      <div style="display:flex;justify-content:space-between;align-items:center;">
        <b>${r.period_name}</b>
        <span class="badge ${badgeCls}">${r.status}</span>
      </div>
      <div style="font-size:.82rem;color:#6b7280;margin-top:4px;">
        Saldo banco: ${fmt(r.bank_balance_end)} | Saldo libros: ${fmt(r.book_balance_end)}
      </div>
      <div style="font-size:.82rem;margin-top:4px;color:${balanced?'var(--success)':'var(--danger)'}">
        ${balanced?'✅ Conciliado':'⚠️ Diferencia: '+fmt(r.difference)}
      </div>
    </div>`;
  }).join('') || '<p style="color:#9ca3af;font-size:.9rem;">Sin conciliaciones</p>';
}

async function createReconciliation() {
  const accId   = document.getElementById('rec-account').value;
  const period  = document.getElementById('rec-period').value.trim();
  const pstart  = document.getElementById('rec-pstart').value;
  const pend    = document.getElementById('rec-pend').value;
  const bankEnd = parseFloat(document.getElementById('rec-bank-end').value) || 0;
  const bookEnd = parseFloat(document.getElementById('rec-book-end').value) || 0;
  if (!accId || !period || !pstart || !pend) return showAlert('Complete todos los campos', false);

  const r = await fetch('/api/bancos/reconciliations', {
    method:'POST', headers:{'Content-Type':'application/json'},
    body: JSON.stringify({bank_account_id:parseInt(accId), period_name:period,
      period_start:pstart, period_end:pend,
      bank_balance_start:0, bank_balance_end:bankEnd,
      book_balance_start:0, book_balance_end:bookEnd})
  });
  if (r.ok) {
    const d = await r.json();
    showAlert('Conciliación iniciada');
    loadReconciliations();
    viewReconciliation(d.id);
  } else {
    const d = await r.json();
    showAlert(d.detail||'Error',false);
  }
}

async function viewReconciliation(id) {
  currentRecId = id;
  const r = await fetch(`/api/bancos/reconciliations/${id}`);
  const d = await r.json();

  document.getElementById('rec-form-card').style.display = 'none';
  const detailCard = document.getElementById('rec-detail-card');
  detailCard.style.display = 'block';
  document.getElementById('rec-detail-title').textContent = `Conciliación — ${d.period_name}`;

  const balanced = d.is_balanced;
  const adjBank  = d.bank_balance_end + d.deposits_in_transit - d.outstanding_checks;
  const adjBooks = d.book_balance_end  + d.bank_credits - d.bank_charges;

  document.getElementById('rec-formula').innerHTML = `
    <div style="display:grid;grid-template-columns:1fr 1fr;gap:16px;">
      <div>
        <b style="color:#1a56db;">SALDO BANCO (extracto)</b>
        <div class="rec-row"><span>Saldo final banco</span><span>${fmt(d.bank_balance_end)}</span></div>
        <div class="rec-row"><span>+ Depósitos en tránsito</span><span>${fmt(d.deposits_in_transit)}</span></div>
        <div class="rec-row"><span>- Cheques pendientes</span><span>(${fmt(d.outstanding_checks)})</span></div>
        <div class="rec-row total"><span>= Saldo banco ajustado</span><span>${fmt(adjBank)}</span></div>
      </div>
      <div>
        <b style="color:#16a34a;">SALDO LIBROS (contabilidad)</b>
        <div class="rec-row"><span>Saldo libros</span><span>${fmt(d.book_balance_end)}</span></div>
        <div class="rec-row"><span>+ Créditos banco no registrados</span><span>${fmt(d.bank_credits)}</span></div>
        <div class="rec-row"><span>- Cargos banco no registrados</span><span>(${fmt(d.bank_charges)})</span></div>
        <div class="rec-row total"><span>= Saldo libros ajustado</span><span>${fmt(adjBooks)}</span></div>
      </div>
    </div>
    <div class="${balanced?'rec-balanced':'rec-unbalanced'}">
      ${balanced ? '✅ CONCILIADA — Diferencia: $0.00' : `⚠️ DIFERENCIA: ${fmt(d.difference)} — Agregue partidas hasta cuadrar`}
    </div>`;

  // Items
  const itemsList = document.getElementById('rec-items-list');
  itemsList.innerHTML = (d.items||[]).length ? `
    <table style="font-size:.82rem;">
      <thead><tr><th>Tipo</th><th>Descripción</th><th>Monto</th><th></th></tr></thead>
      <tbody>
        ${(d.items||[]).map(i => `<tr>
          <td style="font-size:.75rem;">${i.type}</td>
          <td>${i.description}</td>
          <td class="${parseFloat(i.amount)>=0?'amount-pos':'amount-neg'}">${fmt(i.amount)}</td>
          <td><button type="button" class="btn btn-sm" style="background:#fee2e2;color:#dc2626;"
            onclick="deleteRecItem(${i.id})">✕</button></td>
        </tr>`).join('')}
      </tbody>
    </table>` : '<p style="color:#9ca3af;font-size:.85rem;">Sin partidas de conciliación</p>';

  document.getElementById('btn-finalize').style.display = d.status === 'APROBADA' ? 'none' : 'block';
}

async function addRecItem() {
  if (!currentRecId) return;
  const type   = document.getElementById('item-type').value;
  const amount = parseFloat(document.getElementById('item-amount').value) || 0;
  const desc   = document.getElementById('item-desc').value.trim();
  if (!desc || amount === 0) return showAlert('Complete tipo, monto y descripción', false);

  const r = await fetch(`/api/bancos/reconciliations/${currentRecId}/items`, {
    method:'POST', headers:{'Content-Type':'application/json'},
    body: JSON.stringify({item_type:type, description:desc, amount})
  });
  if (r.ok) {
    document.getElementById('item-amount').value='';
    document.getElementById('item-desc').value='';
    viewReconciliation(currentRecId);
    loadReconciliations();
  } else {
    const d = await r.json();
    showAlert(d.detail||'Error',false);
  }
}

async function deleteRecItem(itemId) {
  if (!currentRecId) return;
  const r = await fetch(`/api/bancos/reconciliations/${currentRecId}/items/${itemId}`, {method:'DELETE'});
  if (r.ok) { viewReconciliation(currentRecId); loadReconciliations(); }
}

async function finalizeReconciliation() {
  if (!currentRecId) return;
  const r = await fetch(`/api/bancos/reconciliations/${currentRecId}/finalize`, {method:'PUT'});
  if (r.ok) {
    showAlert('Conciliación aprobada exitosamente');
    viewReconciliation(currentRecId);
    loadReconciliations();
  } else {
    const d = await r.json();
    showAlert(d.detail||'No se puede aprobar',false);
  }
}

// ── Init ───────────────────────────────────────────────────────────────────────
(async function init() {
  const today = new Date().toISOString().split('T')[0];
  const firstOfMonth = today.slice(0,8)+'01';
  document.getElementById('txn-start').value = firstOfMonth;
  document.getElementById('txn-end').value   = today;
  document.getElementById('ntxn-date').value = today;
  document.getElementById('rec-pstart').value= firstOfMonth;
  document.getElementById('rec-pend').value  = today;
  const month = new Date().toLocaleString('es-EC',{month:'long'});
  const year  = new Date().getFullYear();
  document.getElementById('rec-period').value= `${month.charAt(0).toUpperCase()+month.slice(1)} ${year}`;

  await loadBankAccounts();
})();
</script>
