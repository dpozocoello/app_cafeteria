<svg xmlns="http://www.w3.org/2000/svg"
     viewBox="0 0 400 300" width="400" height="300" role="img"
     aria-label="Sanduche de Chorizo Ahumado">
  <defs>
    <!-- Fondo oscuro -->
    <linearGradient id="bg_FIN_SAN_004" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%"   stop-color="#1e293b"/>
      <stop offset="100%" stop-color="#0f172a"/>
    </linearGradient>
    <!-- Acento de categoría -->
    <linearGradient id="acc_FIN_SAN_004" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%"   stop-color="#f59e0b"/>
      <stop offset="100%" stop-color="#dc2626"/>
    </linearGradient>
    <!-- Sombra suave del plato -->
    <filter id="shadow_FIN_SAN_004" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="4" stdDeviation="8" flood-color="#000" flood-opacity="0.4"/>
    </filter>
    <!-- Brillo interior del plato -->
    <radialGradient id="plate_FIN_SAN_004" cx="40%" cy="35%" r="60%">
      <stop offset="0%"   stop-color="rgba(255,255,255,0.18)"/>
      <stop offset="100%" stop-color="rgba(255,255,255,0.04)"/>
    </radialGradient>
    <clipPath id="clip_FIN_SAN_004">
      <rect width="400" height="300" rx="14"/>
    </clipPath>
    <style>
      .pname  { font-family: Outfit, ui-sans-serif, sans-serif; font-size: 17px;
                 font-weight: 700; fill: #f1f5f9; letter-spacing: 0.3px; }
      .brand  { font-family: Outfit, ui-sans-serif, sans-serif; font-size: 10px;
                 fill: #64748b; letter-spacing: 1.5px; }
      .tag    { font-family: Outfit, ui-sans-serif, sans-serif; font-size: 9px;
                 font-weight: 700; fill: #0f172a; letter-spacing: 2px; }
      .price  { font-family: Outfit, ui-sans-serif, sans-serif; font-size: 15px;
                 font-weight: 800; fill: #0f172a; }
      .emoji  { font-family: "Segoe UI Emoji","Apple Color Emoji","Noto Color Emoji",serif; }
    </style>
  </defs>

  <!-- ░░ Fondo base ░░ -->
  <g clip-path="url(#clip_FIN_SAN_004)">
    <rect width="400" height="300" fill="url(#bg_FIN_SAN_004)"/>

    <!-- Barra de acento superior (8px) -->
    <rect x="0" y="0" width="400" height="8" fill="url(#acc_FIN_SAN_004)"/>

    <!-- Puntos decorativos de fondo -->
    <circle cx="360" cy="60"  r="80" fill="#f59e0b" opacity="0.05"/>
    <circle cx="40"  cy="240" r="60" fill="#dc2626" opacity="0.05"/>

    <!-- Tag de categoría (chip superior izquierdo) -->
    <rect x="16" y="20" width="72" height="20" rx="10" fill="url(#acc_FIN_SAN_004)" opacity="0.9"/>
    <text x="52" y="34" text-anchor="middle" class="tag">AHUMADO</text>

    <!-- ░░ Plato circular (zona visual central) ░░ -->
    <circle cx="200" cy="118" r="78"
            fill="rgba(251,191,36,0.12)" stroke="rgba(251,191,36,0.30)"
            stroke-width="1.5" filter="url(#shadow_FIN_SAN_004)"/>
    <circle cx="200" cy="118" r="78" fill="url(#plate_FIN_SAN_004)"/>

    <!-- Emoji principal (grande, centrado en el plato) -->
    <text x="200" y="138" text-anchor="middle" dominant-baseline="middle"
          class="emoji" font-size="60">🌭</text>

    <!-- ░░ Nombre del producto ░░ -->
    <text text-anchor="middle" class="pname">
    <tspan x="200" y="136" class="pname">Chorizo</tspan>
    <tspan x="200" y="160" class="pname">Ahumado</tspan>
    </text>

    <!-- ░░ Precio en badge ░░ -->
    <rect x="165" y="210" width="70" height="28" rx="14"
          fill="url(#acc_FIN_SAN_004)"/>
    <text x="200" y="229" text-anchor="middle" class="price">$ 3.75</text>

    <!-- ░░ Branding JECA ░░ -->
    <text x="200" y="288" text-anchor="middle" class="brand">
      JECA · PIQUEOS &amp; CAFETERIA
    </text>

    <!-- Línea separadora inferior -->
    <rect x="40" y="268" width="320" height="1" fill="url(#acc_FIN_SAN_004)" opacity="0.3"/>
  </g>
</svg>